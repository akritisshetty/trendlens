services:
  - type: web
    name: trendlens
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://trendlens-dnih.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://trendlens-dnih.onrender.com/api/*
